name: Deploy Frontend Only

# frontend/** 변경 push 시 자동 트리거 — 스캔 재실행 없이 빠른 배포

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: divergence-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Checkout gh-pages (보존용)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current

      - name: Build payload
        run: |
          mkdir -p _site
          [ -f gh-pages-current/divergence_results.json ] && cp gh-pages-current/divergence_results.json _site/
          [ -f gh-pages-current/divergence_report.html ] && cp gh-pages-current/divergence_report.html _site/
          [ -f gh-pages-current/last_update.json ] && cp gh-pages-current/last_update.json _site/
          # main에 frontend가 있으면 그걸 우선
          if [ -f frontend/index.html ]; then
            cp frontend/index.html _site/index.html
          elif [ -f gh-pages-current/index.html ]; then
            cp gh-pages-current/index.html _site/index.html
          fi
          ls -la _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          commit_message: "frontend deploy: ${{ github.event.head_commit.message || 'manual' }}"
