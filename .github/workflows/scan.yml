name: Divergence Scan

on:
  # 평일 KST 21:00 = UTC 12:00
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:        # 수동 트리거 (관리자: GitHub Actions UI)

permissions:
  contents: write

concurrency:
  group: divergence-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly divergence scan (KR ALL)
        env:
          TZ: Asia/Seoul
          FAST_MODE: "1"  # get_fallback_tickers 직행 (KRX live 너무 느림)
        run: python weekly_divergence_screener.py KR 500

      - name: Prepare gh-pages payload (master frontend + 새 JSON)
        run: |
          mkdir -p _site
          # frontend/index.html 우선, fallback to gh-pages 기존 index.html
          if [ -f frontend/index.html ]; then
            cp frontend/index.html _site/index.html
          else
            git fetch origin gh-pages
            git show origin/gh-pages:index.html > _site/index.html
          fi
          [ -f divergence_results.json ] && cp divergence_results.json _site/
          [ -f divergence_report.html ] && cp divergence_report.html _site/
          date -u +"{\"updated_at\":\"%Y-%m-%dT%H:%M:%SZ\"}" > _site/last_update.json
          ls -la _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
          commit_message: "scan ${{ github.run_number }} (${{ github.event_name }})"
